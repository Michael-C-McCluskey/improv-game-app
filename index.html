<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16122e">
  <meta name="description" content="A phone-first improv party game for 2-4 players.">
  <title>Improv Night 🎭</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span aria-hidden="true">🎭</span> Improv Night</div>
    <span class="round-badge" id="round-badge" hidden></span>
    <span class="mini-timer" id="mini-timer" aria-hidden="true" data-testid="mini-timer" hidden></span>
    <button type="button" class="tv-toggle" data-action="toggle-tv" data-testid="tv-toggle" aria-pressed="false" aria-label="TV mode">📺 <span class="tv-label">TV</span></button>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <div id="flash" class="flash" data-testid="times-up" data-action="dismiss-flash" role="alert" hidden>
    <div class="flash-inner">
      <div class="flash-emoji" aria-hidden="true">⏰</div>
      <div class="flash-text">Time’s up!</div>
      <div class="flash-sub">Tap to close</div>
    </div>
  </div>

  <noscript><p class="noscript">Improv Night needs JavaScript turned on.</p></noscript>
  <script src="prompts.js"></script>
  <script src="app.js"></script>
</body>
</html>
